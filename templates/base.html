<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}زيرو داي{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="nav-backdrop" id="nav-backdrop" hidden aria-hidden="true"></div>
    <header class="site-header" id="site-header">
        <div class="header-inner">
            <div class="header-brand">
                <p class="brand-title">زيرو داي</p>
                <p class="brand-tagline">تعريف متقدم بهجمات اليوم صفر ومحاكاة تعليمية آمنة</p>
            </div>
            <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-navigation" aria-label="فتح أو إغلاق القائمة">
                <span class="nav-toggle-bars" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
            {% set ep = request.endpoint %}
            <nav class="main-nav" id="site-navigation" aria-label="التنقل الرئيسي">
                <a href="{{ url_for('index') }}" class="nav-link {% if ep == 'index' %}is-active{% endif %}">الرئيسية</a>
                <a href="{{ url_for('vulnerabilities_page') }}" class="nav-link {% if ep == 'vulnerabilities_page' %}is-active{% endif %}">الثغرات</a>
                <a href="{{ url_for('simulation_page') }}" class="nav-link {% if ep == 'simulation_page' %}is-active{% endif %}">المحاكاة</a>
                <a href="{{ url_for('timeline_page') }}" class="nav-link {% if ep == 'timeline_page' %}is-active{% endif %}">الجدول الزمني</a>
                <a href="{{ url_for('quiz_page') }}" class="nav-link {% if ep == 'quiz_page' %}is-active{% endif %}">الاختبار</a>
                <a href="{{ url_for('about_page') }}" class="nav-link {% if ep == 'about_page' %}is-active{% endif %}">حول المشروع</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="footer-site">
        مشروع تعليمي — المحتوى للتوعية فقط دون تقديم أدوات استغلال حقيقية.
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
