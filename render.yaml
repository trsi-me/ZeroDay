# ZeroDay على Render — اقرأ قبل النشر
#
# ❌ خطأ شائع: وضع أمر gunicorn في «Build Command»
#    عندها يفشل البناء لأن gunicorn غير مثبت بعد (سترى: gunicorn: command not found)
#
# ✅ على الموقع (Settings) تأكد من:
#    Build Command  = السطر الأول فقط (التثبيت + البذر)
#    Start Command  = السطر الثاني فقط (تشغيل السيرفر)
#
# إذا كان الملف render.yaml مربوطاً بخدمة Blueprint، لا تكرر هذه الأوامر يدوياً في
# الحقول إن كانت تلغي الملف — أو اترك الحقول فارغة ليملأها Render من الـ repo.

services:
  - type: web
    name: zeroday-site
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FLASK_ENV
        value: production
